<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https://script.google.com https://script.googleusercontent.com;">
<title>Sales Scorecard – SURGE EUROPE</title>
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #1a1a1a;
    --surface2: #222222;
    --border: #2e2e2e;
    --border-strong: #404040;
    --gold: #c9a227;
    --gold-light: #e8c55a;
    --gold-dark: #8a6e18;
    --text: #f0ede6;
    --text-muted: #999999;
    --text-hint: #666666;
    --green-bg: #0f2010;
    --green-text: #4aaa20;
    --amber-bg: #201508;
    --amber-text: #d4941e;
    --red-bg: #200a0a;
    --red-text: #cc4040;
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1.5rem 3rem;
  }

  .page { max-width: 900px; margin: 0 auto; }

  /* HEADER */
  .header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 2.5rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--gold-dark);
  }
  .logo-img { width: 120px; height: auto; flex-shrink: 0; }
  .header-text {}
  .brand { font-size: 11px; font-weight: 700; color: var(--gold); letter-spacing: .15em; text-transform: uppercase; }
  .page-title { font-size: 28px; font-weight: 800; color: var(--text); letter-spacing: -.02em; margin-top: 2px; }

  /* WEEK BAR */
  .week-bar {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    padding: 14px 20px;
    margin-bottom: 1.5rem;
  }
  .week-bar label { font-size: 14px; font-weight: 600; color: var(--text-muted); white-space: nowrap; }
  .week-bar input[type="week"] {
    font-size: 16px; font-weight: 600;
    padding: 6px 10px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    color-scheme: dark;
  }
  .week-range { font-size: 16px; font-weight: 700; color: var(--gold); }

  /* TEAM CARDS */
  .team-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 1.5rem; }
  .tcard {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 1.25rem 1rem;
    text-align: center;
  }
  .tcard .num { font-size: 42px; font-weight: 900; line-height: 1; letter-spacing: -.04em; }
  .tcard .lbl { font-size: 12px; color: var(--text-muted); margin-top: 5px; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; }

  /* BENCHMARK NOTE */
  .bench-note {
    font-size: 12px; color: var(--text-hint);
    text-align: right;
    margin-top: -8px;
    margin-bottom: 1.25rem;
  }
  .bench-note span { color: var(--gold); font-weight: 600; }

  /* PERSON CARDS */
  .persons { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 1.5rem; }
  .pcard {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .pcard-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 22px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }
  .av {
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 800;
    border: 2px solid var(--gold-dark);
  }
  .av-ob { background: #0a1a2e; color: #4a9eff; }
  .av-jm { background: #1a0a2e; color: #a060ff; }
  .pname { font-size: 18px; font-weight: 800; margin-left: 12px; color: var(--text); }
  .score-pill {
    padding: 6px 16px; border-radius: 99px;
    font-size: 16px; font-weight: 900;
    border: 2px solid transparent;
    text-align: center; line-height: 1.3;
    min-width: 80px;
  }

  .pcard-body { padding: 18px 22px; display: flex; flex-direction: column; gap: 16px; }

  .irow { display: flex; align-items: center; gap: 14px; }
  .irow label { font-size: 14px; font-weight: 500; color: var(--text-muted); flex: 1; min-width: 0; }
  .irow .sublabel { font-size: 11px; color: var(--text-hint); display: block; margin-top: 1px; }
  .bar-wrap { width: 80px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; flex-shrink: 0; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width .3s ease; }
  .irow input[type="number"] {
    width: 68px; text-align: center;
    font-size: 22px; font-weight: 900;
    padding: 6px 4px;
    border: 1.5px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: var(--bg);
    color: var(--text);
    flex-shrink: 0;
  }
  .irow input[type="number"]:focus { outline: none; border-color: var(--gold); }

  /* BOTTOM */
  .bottom-section { display: flex; gap: 14px; margin-bottom: 1.5rem; align-items: flex-start; }
  .notes-wrap { flex: 1; }
  .notes-wrap label { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .06em; }
  .notes-wrap textarea {
    width: 100%; font-size: 14px; padding: 12px 14px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: var(--surface); color: var(--text);
    resize: none; height: 72px; font-family: inherit;
  }
  .notes-wrap textarea:focus { outline: none; border-color: var(--gold); }
  .save-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; padding-top: 22px; }
  .btn-save {
    padding: 12px 24px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--gold-dark);
    background: var(--gold);
    color: #000;
    font-size: 15px; font-weight: 800;
    cursor: pointer; white-space: nowrap;
    transition: opacity .15s;
  }
  .btn-save:hover { opacity: .85; }
  .save-msg { font-size: 12px; color: var(--gold); }

  /* DIVIDER */
  .divider { height: 1px; background: var(--border-strong); margin-bottom: 1.5rem; }

  /* HISTORY */
  .hist-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem 1.5rem;
  }
  .hist-title { font-size: 12px; font-weight: 800; color: var(--gold); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 1rem; }
  .hrow { display: flex; align-items: flex-start; flex-wrap: wrap; gap: 6px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .hrow:last-child { border-bottom: none; }
  .hw { font-size: 14px; color: var(--text-muted); font-weight: 600; min-width: 150px; }
  .hpill { padding: 4px 14px; border-radius: 99px; font-size: 14px; font-weight: 800; border: 1px solid transparent; }
  .hmeet { font-size: 13px; color: var(--text-hint); }
  .hnote { font-size: 12px; color: var(--text-hint); font-style: italic; }
  .hempty { font-size: 14px; color: var(--text-hint); font-style: italic; }
</style>
</head>

<script>
const BM={m:2,l:5,f:5,p:2},W={m:2,l:5,f:5,p:2},WT=14;

function wlbl(v){
  if(!v)return'';
  const[y,w]=v.split('-W');
  const d=new Date(+y,0,1+(+w-1)*7);
  d.setDate(d.getDate()-(d.getDay()||7)+1);
  const e=new Date(d);e.setDate(d.getDate()+6);
  const f=x=>x.toLocaleDateString('sk-SK',{day:'2-digit',month:'2-digit',year:'numeric'});
  return f(d)+' – '+f(e);
}

function sc(m,l,f,p){
  const s=Math.min(m/BM.m,1)*W.m+Math.min(l/BM.l,1)*W.l+Math.min(f/BM.f,1)*W.f+Math.min(p/BM.p,1)*W.p;
  return Math.round(s/WT*100);
}
function ov(m,l,f,p){
  const o=Math.max(0,m/BM.m-1)*W.m+Math.max(0,l/BM.l-1)*W.l+Math.max(0,f/BM.f-1)*W.f+Math.max(0,p/BM.p-1)*W.p;
  return Math.round(o/WT*100);
}

function pc(s){
  if(s>=75)return{bg:'#0f2010',c:'#4aaa20',border:'#2a6010'};
  if(s>=45)return{bg:'#201508',c:'#d4941e',border:'#7a5008'};
  return{bg:'#200a0a',c:'#cc4040',border:'#6a1818'};
}

function bc(v,max){
  const r=v/max;
  return r>=1?'#c9a227':r>=0.5?'#9a7010':'#8a3030';
}

function sb(id,v,max){
  const el=document.getElementById(id);
  el.style.width=Math.min(v/max,1)*100+'%';
  el.style.background=bc(v,max);
}

function g(id){return+document.getElementById(id).value||0;}

function meetBadge(m){
  if(m>=2)return'✓';
  return m+'/'+'2';
}

function calc(){
  const o={m:g('ob-m'),l:g('ob-l'),f:g('ob-f'),p:g('ob-p')};
  const j={m:g('jm-m'),l:g('jm-l'),f:g('jm-f'),p:g('jm-p')};
  ['m','l','f','p'].forEach(k=>{sb('ob-'+k+'b',o[k],BM[k]);sb('jm-'+k+'b',j[k],BM[k]);});

  const os=sc(o.m,o.l,o.f,o.p),js=sc(j.m,j.l,j.f,j.p),ts=Math.round((os+js)/2);
  const opc=pc(os),jpc=pc(js),tpc=pc(ts);

  const oos=ov(o.m,o.l,o.f,o.p),ojs=ov(j.m,j.l,j.f,j.p);
  const op=document.getElementById('obp');
  op.innerHTML=os+'%'+(oos>0?'<br><span style="font-size:12px;opacity:.85">+'+oos+'% navyše</span>':'');
  op.style.background=opc.bg;op.style.color=opc.c;op.style.borderColor=opc.border;
  const jp=document.getElementById('jmp');
  jp.innerHTML=js+'%'+(ojs>0?'<br><span style="font-size:12px;opacity:.85">+'+ojs+'% navyše</span>':'');
  jp.style.background=jpc.bg;jp.style.color=jpc.c;jp.style.borderColor=jpc.border;

  document.getElementById('tm').textContent=o.m+j.m;
  document.getElementById('tl').textContent=o.l+j.l;
  const ots=Math.round((oos+ojs)/2);
  document.getElementById('ts').textContent=ts+'%'+(ots>0?' +'+ots+'%':'');
  document.getElementById('ts').style.color=tpc.c;
  document.getElementById('tcard-score').style.background=tpc.bg;
  document.getElementById('tcard-score').style.borderColor=tpc.border;
  document.getElementById('tslbl').style.color=tpc.c;

  // meeting benchmark highlight
  const meetTotal=o.m+j.m;

const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwgUKtdXG5VOjOLGAUk8Yva5E54OEEFJUSbj8rjZmi1r7E-jeoNeTICsCxMY5SoTZDrNA/exec';
// ────────────────────────────────────────────────────────────────────

function lsGet(){try{return JSON.parse(localStorage.getItem('surge_sc_v1')||'[]');}catch{return[];}}
function lsSet(h){try{localStorage.setItem('surge_sc_v1',JSON.stringify(h));}catch{}}

function jsonpCall(params){
  return new Promise(function(resolve){
    const cb='sc_'+Date.now();
    const sid='jsonp_'+cb;
    window[cb]=function(data){
      delete window[cb];
      const s=document.getElementById(sid);
      if(s)s.remove();
      resolve({ok:true,data:data});
    };
    const s=document.createElement('script');
    s.id=sid;
    params.callback=cb;
    params.t=Date.now();
    const qs=Object.keys(params).map(k=>k+'='+encodeURIComponent(typeof params[k]==='object'?JSON.stringify(params[k]):params[k])).join('&');
    s.src=SCRIPT_URL+'?'+qs;
    s.onerror=function(){
      delete window[cb];
      s.remove();
      resolve({ok:false});
    };
    setTimeout(function(){
      if(window[cb]){delete window[cb];s.remove();resolve({ok:false});}
    },8000);
    document.head.appendChild(s);
  });
}

async function remoteGet(){
  const r=await jsonpCall({action:'load'});
  if(r.ok&&Array.isArray(r.data)){lsSet(r.data);return r.data;}
  return lsGet();
}

async function remotePost(entry){
  const r=await jsonpCall({action:'save',data:entry});
  return r.ok;
}

async function save(){
  const w=document.getElementById('wp').value;
  if(!w){document.getElementById('smsg').textContent='Vyber najprv týždeň.';return;}
  const e={week:w,label:wlbl(w),notes:document.getElementById('notes').value,
    o:{m:g('ob-m'),l:g('ob-l'),f:g('ob-f'),p:g('ob-p')},
    j:{m:g('jm-m'),l:g('jm-l'),f:g('jm-f'),p:g('jm-p')}};
  // uloz lokalne hned
  const h=lsGet().filter(x=>x.week!==w);h.unshift(e);lsSet(h);
  document.getElementById('smsg').textContent='Ukladám do Sheets…';
  const ok=await remotePost(e);
  document.getElementById('smsg').textContent=ok?'Uložené ✓ (Sheets + lokálne)':'Uložené lokálne (Sheets nedostupný – skontroluj Apps Script)';
  setTimeout(()=>document.getElementById('smsg').textContent='',4000);
  await renderH();
}

async function renderH(){
  const h=await remoteGet(),el=document.getElementById('hist');
  if(!h.length){el.innerHTML='<p class="hempty">Zatiaľ žiadne záznamy.</p>';return;}
  el.innerHTML=h.map(e=>{
    const os=sc(e.o.m,e.o.l,e.o.f,e.o.p),js=sc(e.j.m,e.j.l,e.j.f,e.j.p);
    const opc=pc(os),jpc=pc(js);
    const obMeetOk=e.o.m>=2,jmMeetOk=e.j.m>=2;
    const meetStr=`stretnutia: OB ${e.o.m||0} ${obMeetOk?'✓':'✗'} · JM ${e.j.m||0} ${jmMeetOk?'✓':'✗'}`;
    const oos2=ov(e.o.m,e.o.l,e.o.f,e.o.p),ojs2=ov(e.j.m,e.j.l,e.j.f,e.j.p);
    return`<div class="hrow" style="flex-wrap:wrap;gap:8px;">
      <span class="hw" style="width:100%;margin-bottom:2px;">${e.label||e.week}</span>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%;">
        <span class="hpill" style="background:${opc.bg};color:${opc.c};border-color:${opc.border}">OB ${os}%${oos2>0?' +'+oos2+'%':''}</span>
        <span class="hpill" style="background:${jpc.bg};color:${jpc.c};border-color:${jpc.border}">JM ${js}%${ojs2>0?' +'+ojs2+'%':''}</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;width:100%;margin-top:4px;font-size:12px;color:#888;">
        <span>Stretnutia: OB <b style="color:#ccc">${e.o.m||0}</b> ${(e.o.m||0)>=2?'✓':'✗'} &nbsp;·&nbsp; JM <b style="color:#ccc">${e.j.m||0}</b> ${(e.j.m||0)>=2?'✓':'✗'}</span>
        <span>Noví leady: OB <b style="color:#ccc">${e.o.l||0}</b> ${(e.o.l||0)>=5?'✓':'✗'} &nbsp;·&nbsp; JM <b style="color:#ccc">${e.j.l||0}</b> ${(e.j.l||0)>=5?'✓':'✗'}</span>
        <span>Follow-upy: OB <b style="color:#ccc">${e.o.f||0}</b> ${(e.o.f||0)>=5?'✓':'✗'} &nbsp;·&nbsp; JM <b style="color:#ccc">${e.j.f||0}</b> ${(e.j.f||0)>=5?'✓':'✗'}</span>
        <span>Posun statusu: OB <b style="color:#ccc">${e.o.p||0}</b> ${(e.o.p||0)>=2?'✓':'✗'} &nbsp;·&nbsp; JM <b style="color:#ccc">${e.j.p||0}</b> ${(e.j.p||0)>=2?'✓':'✗'}</span>
        ${e.notes?`<span style="grid-column:1/-1;font-style:italic;color:#666">${e.notes}</span>`:''}
      </div>
    </div>`;
  }).join('');
}

wp.value=`${y}-W${String(wn).padStart(2,'0')}`;

wp.addEventListener('change',()=>document.getElementById('wlbl').textContent=wlbl(wp.value));
calc();(async()=>{await renderH();})();
